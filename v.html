<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine?</title>

  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    html, body { height: 100%; margin: 0; }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:#3a0b1d;
      background:
        radial-gradient(900px 600px at 15% 10%, #ffd1e6, transparent 60%),
        radial-gradient(900px 600px at 85% 90%, #ffb3d5, transparent 60%),
        linear-gradient(135deg, #ff5ea8, #ff8bc7, #ffd3e7);
    }

    /* Floating hearts background */
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      filter: blur(0.2px);
    }
    .heart {
      position: absolute;
      font-size: 22px;
      animation: floatUp linear infinite;
      transform: translateY(110vh);
      user-select: none;
    }
    @keyframes floatUp {
      from { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      to   { transform: translateY(-20vh) translateX(40px) rotate(20deg); opacity: 0; }
    }

    .card{
      position: relative;
      width: min(92vw, 460px);
      padding: 28px 22px;
      border-radius: 26px;
      text-align: center;

      background: rgba(255,255,255,0.7);
      border: 2px solid rgba(255, 80, 160, 0.25);
      box-shadow: 0 25px 80px rgba(120, 0, 60, 0.35);
      backdrop-filter: blur(12px);
    }

    .ribbon {
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 90, 170, 0.12);
      border: 1px solid rgba(255, 90, 170, 0.25);
      color:#7a1038;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .emoji { font-size: 62px; margin: 2px 0 6px; }
    h1 { margin: 0 0 8px; font-size: 30px; color:#5d0a29; }
    p { margin: 0 0 18px; opacity: 0.85; }

    .buttons{
      display:flex;
      justify-content:center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button{
      border: none;
      border-radius: 18px;
      padding: 14px 22px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow: 0 14px 30px rgba(120, 0, 60, 0.18);
      user-select: none;
      outline: none;
    }
    button:active { transform: translateY(1px) scale(0.99); }

    #yes {
      background: linear-gradient(180deg, #2ee59d, #1fd38c);
      color:#043322;
    }
    #no {
      background: linear-gradient(180deg, #ff5b7f, #ff3f6c);
      color:#3b0614;
    }

    .hint{
      margin-top: 16px;
      font-weight: 700;
      color:#7a1038;
      min-height: 22px;
    }

    .hidden { display: none; }

    .yes-screen .emoji { font-size: 76px; }
    .yes-screen h1 { font-size: 38px; }
    .tiny {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 14px;
    }

    /* little sparkles */
    .sparkles {
      position:absolute;
      inset:-20px;
      border-radius: 30px;
      background:
        radial-gradient(2px 2px at 15% 25%, rgba(255,255,255,0.9), transparent 60%),
        radial-gradient(2px 2px at 85% 30%, rgba(255,255,255,0.9), transparent 60%),
        radial-gradient(2px 2px at 35% 80%, rgba(255,255,255,0.7), transparent 60%),
        radial-gradient(2px 2px at 70% 75%, rgba(255,255,255,0.8), transparent 60%);
      pointer-events:none;
      opacity: 0.7;
      mix-blend-mode: screen;
    }
  </style>
</head>

<body>
  <!-- Background hearts layer -->
  <div class="hearts" id="hearts"></div>

  <!-- QUESTION SCREEN -->
  <div class="card" id="questionScreen">
    <div class="sparkles"></div>

    <div class="ribbon">💌 Valentine </div>
    <div class="emoji">🌹</div>
    <h1>Yaya will you be my Valentine?</h1>
    <p>I dare you to press no..</p>

    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <div class="hint" id="hint"></div>
    <div class="tiny">Tip: the “Yes” button might become… innevitable.</div>
  </div>

  <!-- YES SCREEN -->
  <div class="card hidden yes-screen" id="yesScreen">
    <div class="sparkles"></div>

    <div class="emoji">🎀</div>
    <h1>LESSGOOOO!!</h1>
    <p>FFAHHHH!! We're just cool like that 🤙🤙🤙 </p>
    <div class="tiny">Happy Valentine’s Hbb 💕</div>
  </div>

  <script>
    // --- Hearts background generation ---
    const heartsLayer = document.getElementById("hearts");
    const heartEmojis = ["💗","💖","💘","💝","💞","💕","❤️"];
    const HEART_COUNT = 24;

    for (let i = 0; i < HEART_COUNT; i++) {
      const s = document.createElement("span");
      s.className = "heart";
      s.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.fontSize = (16 + Math.random() * 22) + "px";
      s.style.animationDuration = (6 + Math.random() * 8) + "s";
      s.style.animationDelay = (Math.random() * 6) + "s";
      heartsLayer.appendChild(s);
    }

    // --- Button logic ---
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const hint = document.getElementById("hint");

    const questionScreen = document.getElementById("questionScreen");
    const yesScreen = document.getElementById("yesScreen");

    const noTexts = [
      "No",
      "Are you sure?",
      "Really sure????",
      "That's deep💔",
      "Last chance 😤",
      "Ah mta2le halik",
      "khalsine..💔",
      "Not taking no for an answer"
    ];

    let noCount = 0;
    let yesScale = 1;

    noBtn.addEventListener("click", () => {
      noCount = Math.min(noCount + 1, noTexts.length - 1);
      noBtn.textContent = noTexts[noCount];

      // yes button keeps growing
      yesScale += 0.18;
      yesBtn.style.transform = `scale(${yesScale})`;

      hint.textContent = "Try pressing “Yes” 😌💗";

      // Optional: small shake on No to make it funny
      noBtn.animate(
        [
          { transform: "translateX(0)" },
          { transform: "translateX(-6px)" },
          { transform: "translateX(6px)" },
          { transform: "translateX(0)" }
        ],
        { duration: 220 }
      );
    });

    yesBtn.addEventListener("click", () => {
      questionScreen.classList.add("hidden");
      yesScreen.classList.remove("hidden");
    });
  </script>
</body>
</html>
